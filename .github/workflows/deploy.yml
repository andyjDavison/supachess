name: deploy

# Every push to main: run CI, then ship whichever side changed - API to the
# Lightsail VM first, then the UI to Vercel, so the UI never runs against an
# older API. Manual runs ship both. One-time setup is in apps/deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/andyjdavison/supachess-api

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      ui: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ui == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - "apps/api/**"
              - "apps/db/**"
              - "apps/deploy/**"
            ui:
              - "apps/ui/**"

  api-image:
    needs: [ci, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-deploy:
    needs: api-image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          FINGERPRINT: ${{ secrets.LIGHTSAIL_HOST_FINGERPRINT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Public fingerprint only - compare it with `ssh-keygen -lf ~/.ssh/authorized_keys` on the VM.
          # -y only works on a private key, so a pasted .pub file fails here too.
          if ! pub=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>/dev/null); then
            echo "LIGHTSAIL_SSH_KEY is not a valid private key (paste the whole private file, BEGIN/END lines included, not the .pub)" >&2
            exit 1
          fi
          echo "deploy key: $(printf '%s\n' "$pub" | ssh-keygen -lf -)"
          case "$SSH_USER" in *[[:space:]]*) echo "LIGHTSAIL_USER contains whitespace" >&2; exit 1 ;; esac
          ssh-keyscan -T 10 "$HOST" 2>/dev/null | while read -r line; do
            case "$line" in '#'* | '') continue ;; esac
            fp=$(printf '%s\n' "$line" | ssh-keygen -lf - | awk '{print $2}')
            if [ "$fp" = "$FINGERPRINT" ]; then printf '%s\n' "$line" >> ~/.ssh/known_hosts; fi
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "no host key on LIGHTSAIL_HOST matches LIGHTSAIL_HOST_FINGERPRINT" >&2
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host lightsail
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Copy compose config to VM
        run: |
          ssh lightsail 'mkdir -p ~/supachess/caddy'
          scp apps/deploy/docker-compose.prod.yml lightsail:supachess/
          scp apps/deploy/caddy/Caddyfile lightsail:supachess/caddy/

      - name: Pull and restart
        env:
          API_TAG: ${{ github.sha }}
        run: |
          ssh lightsail "API_TAG=$API_TAG bash -s" <<'EOF'
          set -euo pipefail
          cd ~/supachess
          docker compose -f docker-compose.prod.yml pull api
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker image prune -f
          EOF

  ui-deploy:
    needs: [ci, changes, api-deploy]
    # api-deploy is skipped on UI-only pushes; that's fine, a failure isn't.
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: apps/ui
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
